name: EV ChargePoint — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # 1. CI — Build & verify backend only
  #    (Frontend is built and deployed by Vercel automatically)
  # ==========================================
  ci-backend:
    name: Backend — Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Compile Backend TypeScript
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_12345
          MONGO_URI: mongodb://localhost:27017/test
        run: npm run build

  # ==========================================
  # 2. Docker Build Verification (backend only)
  # ==========================================
  docker-build:
    name: Verify Backend Docker Image
    needs: ci-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ev-chargepoint-backend:latest

  # ==========================================
  # 3. Deploy Backend to AWS EC2
  # ==========================================
  deploy:
    name: Deploy Backend to AWS EC2
    needs: [ci-backend, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "⚡ Deploying EV ChargePoint Backend to EC2..."

            DEPLOY_DIR="$HOME/ev-chargepoint"

            # Clone repo on first deploy
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "First deploy — cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            echo "Pulling latest changes..."
            git checkout main
            git pull origin main

            # Write backend .env on first deploy (secrets come from GitHub)
            if [ ! -f "backend/.env" ]; then
              echo "Creating backend .env from GitHub secrets..."
              cat > backend/.env << EOF
            PORT=5000
            NODE_ENV=production
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            JWT_EXPIRES_IN=7d
            EOF
            fi

            echo "Rebuilding and starting backend container..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            echo "Pruning old Docker images..."
            docker image prune -f

            echo "Waiting for backend to start (15s)..."
            sleep 15

            echo "Running health check..."
            curl --fail http://localhost:5000/api/health || {
              echo "❌ Health check failed!"
              docker compose logs --tail=50
              exit 1
            }

            echo "✅ Backend deployed and healthy on EC2!"
