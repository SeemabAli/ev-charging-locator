name: EV ChargePoint — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # 1. Continuous Integration: Lint & Build
  # ==========================================
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Compile & Build
        working-directory: ${{ matrix.service }}
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          PORT: 5000
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_12345
        run: npm run build

  # ==========================================
  # 2. Container Build Verification
  # ==========================================
  docker-build:
    name: Verify Docker Images
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ev-chargepoint-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000
          push: false
          tags: ev-chargepoint-frontend:latest

  # ==========================================
  # 3. Continuous Deployment to AWS EC2
  # ==========================================
  deploy:
    name: Deploy to AWS EC2
    needs: [ci, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        if: env.EC2_HOST != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "⚡ Starting EV ChargePoint Deployment on AWS EC2..."
            
            # Ensure target directory exists
            DEPLOY_DIR="~/ev-chargepoint"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git $DEPLOY_DIR
            fi
            
            cd $DEPLOY_DIR
            
            echo "Pulling latest changes from main branch..."
            git checkout main
            git pull origin main
            
            # Create production .env if not exists
            if [ ! -f "backend/.env" ]; then
              echo "Configuring production backend environment..."
              echo "PORT=5000" > backend/.env
              echo "NODE_ENV=production" >> backend/.env
              echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> backend/.env
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
              echo "CLIENT_URL=http://${{ secrets.EC2_HOST }}" >> backend/.env
            fi
            
            echo "Rebuilding and deploying containers with Docker Compose..."
            docker compose down --remove-orphans || true
            docker compose up -d --build
            
            echo "Pruning dangling docker images..."
            docker image prune -f
            
            echo "Waiting for services to become healthy..."
            sleep 15
            
            # Check backend health
            curl --fail http://localhost:5000/api/health || {
              echo "❌ Health check failed!"
              docker compose logs --tail=50
              exit 1
            }
            
            echo "✅ EV ChargePoint successfully deployed and verified healthy on AWS EC2!"
