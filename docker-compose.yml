version: '3.8'

# EC2 Deployment: Backend only.
# Frontend is deployed to Vercel (auto-deploys on push to main).
# Database is on MongoDB Atlas (cloud).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ev-chargepoint-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      # Set CLIENT_URL to your Vercel frontend URL after first deploy
      - CLIENT_URL=${CLIENT_URL:-https://ev-charging-locator.vercel.app}
    ports:
      - "5000:5000"
    networks:
      - ev-network

networks:
  ev-network:
    driver: bridge
